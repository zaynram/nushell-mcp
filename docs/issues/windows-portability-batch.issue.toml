  target    = 'Resolve the raw-vehicle includeDirs failure: nu splits --include-path on ":" by design, so drive-letter paths cannot ride the flag. Pick a workaround (NU_LIB_DIRS prepend) or an upstream change, implement it, and pass the test from a UNC cwd.'
  completed = false

  [[tasks.4.subtasks]]
    synopsis = 'Probe NU_LIB_DIRS env as -I substitute'
    llm      = 'automation'
    done     = false

  [[tasks.4.subtasks]]
    synopsis = 'Decide upstream fix vs nushell-mcp workaround'
    llm      = 'augmentation'
    done     = false

  [[tasks.4.subtasks]]
    synopsis = 'Implement chosen fix and verify on Windows Bun'
    llm      = 'augmentation'
    done     = false

[tasks.5]
