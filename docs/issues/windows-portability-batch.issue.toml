  target    = 'Document the Windows run recipe and the nu double-quote backslash trap for test authors in CLAUDE.md.'
  completed = false

  [[tasks.5.subtasks]]
    synopsis = 'Add Windows run recipe to CLAUDE.md'
    llm      = 'automation'
    done     = false

[tasks.6]
