  target    = 'Quote the temp paths that pool.test.ts and smoke.test.ts interpolate into nu cd commands so Windows backslashes survive; verify both tests on Windows Bun.'
  completed = false

  [[tasks.1.subtasks]]
    synopsis = 'Quote cd path in pool.test.ts'
    llm      = 'automation'
    done     = false

  [[tasks.1.subtasks]]
    synopsis = 'Quote cd path in smoke.test.ts'
    llm      = 'automation'
    done     = false

  [[tasks.1.subtasks]]
    synopsis = 'Verify both pass on Windows Bun'
    llm      = 'automation'
    done     = false

