version = '3.0.0'

[issue]
  name   = 'PATHEXT absent in Nushell children'
  slug   = 'pathext-omission'
  date   = 2026-07-14
  status = 'open'

  [issue.reference]
    branch = 'pathext-omission'
    url    = 'https://github.com/zaynram/nushell-mcp/issues/2'
    index  = 2

  [issue.vision]
    outcome = 'singular'

    [[issue.vision.output]]
      purpose = 'Environment builder backfilling Windows-essential variables (PATHEXT and peers) with Windows defaults when the host omits them, at every nu spawn site: one-shot spawnNu (default, env-layered, cleanEnv) and the long-lived nu --mcp children.'
      path    = 'src/env.ts'

    [[issue.vision.output]]
      purpose = 'Test suite with regression coverage for the patched environment builder'
      path    = 'test/env.test.ts'

    [[issue.vision.output]]
      purpose = 'Verification that the patched version bump was deployed to NPM.'
      path    = 'https://www.npmjs.com/package/nushell-mcp/v/0.2.5'

    [issue.vision.criteria]
      requirements = [
        'Bare-name external command resolution succeeds in Nushell executions on Windows without caller-supplied env overrides.',
        "PATHEXT and peer Windows-essential variables are present in every nu child on Windows even when absent from the server's own environment, across the one-shot default, env-layered, and cleanEnv paths and the long-lived nu --mcp children.",
        'Regression tests assert per-platform presence of essential variables and bare-name resolution of a known binary.',
        'Patch released to npm with release notes documenting the resolution semantics.',
      ]
      constraints  = [
        "cleanEnv mode must not leak host environment beyond the explicit essential allowlist; variables Bun itself injects on Windows (SYSTEMROOT, TEMP, PATH, WINDIR) are outside nushell-mcp's control and are documented, not suppressed.",
        'Behavior on POSIX hosts must remain unchanged; the allowlist is Windows-conditional.',
      ]

    [issue.vision.landscape]
      external = [
        "Resolution is delegated to the OS model: both where.exe and nu's which expand extensionless names via PATHEXT, so no shell-side mitigation exists when the variable is absent.",
        'Empirical reproduction (2026-07-13): bare resolution failed while explicit .exe suffix, wildcard, and per-call PATHEXT injection each succeeded across which, where.exe, and direct execution.',
        'The MCP TypeScript SDK stdio client transport launches servers with a fixed whitelist (DEFAULT_INHERITED_ENV_VARS); on win32 it carries APPDATA, HOMEDRIVE, HOMEPATH, LOCALAPPDATA, PATH, PROCESSOR_ARCHITECTURE, SYSTEMDRIVE, SYSTEMROOT, TEMP, USERNAME, USERPROFILE, and PROGRAMFILES, and omits PATHEXT, COMSPEC, and TMP. Claude Desktop using this default is inferred, not verified; the 2026-07-13 symptoms match it exactly.',
        'Bun.spawn on Windows (bun 1.4.1) injects SYSTEMROOT, TEMP, PATH, and WINDIR into any explicit env, even an empty one, but never PATHEXT, COMSPEC, or TMP; an allowlist only needs to carry what the runtime does not.',
        'Reproduction (2026-09-04, nu 0.114.2-nightly.2 and bun 1.4.1 on Windows via WSL interop): with the SDK-whitelist env, `which nu` is empty and bare `^where` fails while `^where.exe` succeeds; adding PATHEXT alone restores both, and the full server env is the passing control.',
      ]

      [[issue.vision.landscape.internal]]
        type            = 'brownfield'
        synopsis        = 'Nushell child env construction: spawnNu in src/nu.ts (default { ...process.env, ...env }, env-layered, bashEnv-merged, cleanEnv = env-only) and the long-lived nu --mcp children in src/client.ts, spawned with no env option.'
        reference       = 'https://github.com/zaynram/nushell-mcp'
        incompatibility = "Never drops PATHEXT but never backfills it: every spawn site passes the inherited env through verbatim, so a host that omits PATHEXT leaves every nu child without it and bare-name resolution fails in nu's which and where.exe despite a correct PATH."

      [[issue.vision.landscape.internal]]
        type     = 'greenfield'
        synopsis = 'A Windows-essential variable allowlist and platform-conditional backfill policy; no prior structure exists for either.'

    [[issue.vision.scope.excluded]]
      item     = 'bashEnv variable capture semantics'
      deferred = false

    [[issue.vision.scope.excluded]]
      item     = 'Windows PATH case normalization quirks'
      deferred = false

  [issue.bindings]
    [[issue.bindings.xvalue]]
      type = 'practice-fidelity'
      item = 'Restores parity between documented tool behavior and actual Windows runtime, keeping nu-fluency skills and hooks truthful about nu-lint availability.'

    [[issue.bindings.xvalue]]
      type = 'gap-closure'
      item = 'Unblocks deterministic nu-lint invocation from Claude Desktop on Windows, the environment where the plugin and MCP pair run outside claude-code.'

    [[issue.bindings.xvalue]]
      type = 'precomputed-context'
      item = 'Encodes the two-resolver diagnosis (which plus where.exe), the host-side origin (SDK stdio whitelist), the runtime-side backfill (Bun), and the per-call workaround so future Windows environment bugs start from a verified causal chain.'

    [[issue.bindings.xabort]]
      action = 'reevaluate'

      [issue.bindings.xabort.trigger]
        mode       = 'OR'
        conditions = [
          'Upstream Nushell resolves extensionless names without consulting PATHEXT',
          'The env builder is rewritten wholesale under a separate refactor issue',
        ]

